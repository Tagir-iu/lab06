name: Linux CI (gcc & clang)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx: g++
            cc: gcc
          - compiler: clang
            cxx: clang++
            cc: clang

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc g++ clang rpm

    - name: Configure
      env:
        CXX: ${{ matrix.cxx }}
        CC: ${{ matrix.cc }}
      run: cmake -B _build

    - name: Build
      run: cmake --build _build

    - name: Run tests
      run: ctest --test-dir _build --output-on-failure

    - name: Create packages
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        cd _build
        cpack -G "DEB;RPM;TGZ;ZIP"

    - name: Upload packages to Release
      if: startsWith(github.ref, 'refs/tags/') && matrix.compiler == 'gcc'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          _build/*.deb
          _build/*.rpm
          _build/*.tar.gz
          _build/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
